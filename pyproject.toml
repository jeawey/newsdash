[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-dashboard"
version = "0.1.0"
description = "Internal sector news dashboard with daily and hourly updates"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "sqlalchemy>=2.0.35",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.1",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "feedparser>=6.0.11",
  "httpx>=0.28.0",
  "apscheduler>=3.11.0",
  "python-dateutil>=2.9.0.post0",
  "jinja2>=3.1.4",
  "pytz>=2025.1",
  "slowapi>=0.1.8"
]

[tool.setuptools]
packages = ["app", "worker"]
