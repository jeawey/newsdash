services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: .
    image: constructive-news:latest
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: sqlite:////data/news_dashboard.sqlite3
    expose:
      - "8000"
    volumes:
      - newsdash_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    image: constructive-news:latest
    depends_on:
      web:
        condition: service_started
    command: python scripts/start_scheduler.py
    environment:
      DATABASE_URL: sqlite:////data/news_dashboard.sqlite3
    volumes:
      - newsdash_data:/data
    restart: unless-stopped

volumes:
  newsdash_data:
  caddy_data:
  caddy_config:
